name: Bootstrap pnpm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: hashFiles('pnpm-lock.yaml') == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Switch CI to frozen lockfile installs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          text = text.replace("pnpm install --no-frozen-lockfile", "pnpm install --frozen-lockfile")
          path.write_text(text)
          PY

      - name: Commit lockfile and finalize CI
        shell: bash
        run: |
          rm .github/workflows/bootstrap-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml .github/workflows/bootstrap-lockfile.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): add pnpm lockfile"
          git push
