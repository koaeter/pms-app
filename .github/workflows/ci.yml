name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pms:pms_ci_password@localhost:5432/pms
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pms
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pms -d pms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @pms/api prisma:migrate:deploy

      - name: API typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm test

      - name: Build all applications
        run: pnpm build
